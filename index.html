<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Special Question 💖</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  text-align:center;
  overflow:hidden;
  background:url("v567-mynt-doodles-01.jpg");
  background-size:cover;
  background-position:center;
}

.overlay{
  background:rgba(255,228,236,0.6);
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1{
  color:#ff4d88;
  font-size:2.5em;
}

button{
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  margin:15px;
  transition:0.3s;
}

#yesBtn{
  background:#ff66a3;
  color:white;
}

#noBtn{
  background:#ccc;
  position:relative;
}

.heart{
  position:absolute;
  font-size:22px;
  animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
  0%{transform:translateY(100vh);opacity:0;}
  50%{opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}
</style>
</head>

<body>

<!-- 🎵 MUSIC (NEVER DESTROY THIS) -->
<audio id="bgMusic" autoplay loop>
  <source src="beabadoobee-Coffee(Lyrics).mp3" type="audio/mpeg">
</audio>

<audio id="celebrationSound">
  <source src="ChildrenYaySoundEffect_(HD).mp3" type="audio/mpeg">
</audio>

<div id="app">
  <div class="overlay">
    <h1 id="typing"></h1>

    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😢</button>
  </div>
</div>

<script>

/* 🎵 MUSIC SAFETY */
const music = document.getElementById("bgMusic");
music.loop = true;

document.body.addEventListener("click", () => {
  music.play().catch(()=>{});
}, { once: true });

/* ✍️ TYPING */
const herName = "Princess";
const typingText = `Hey ${herName} 💖 Wanna hang out tomorrow?`;
let i = 0;

function typeWriter(){
  if(i < typingText.length){
    document.getElementById("typing").innerHTML += typingText.charAt(i);
    i++;
    setTimeout(typeWriter, 60);
  }
}
typeWriter();

/* 🚀 NO BUTTON RUN */
let noClicks = 0;
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

noBtn.addEventListener("mouseover", moveNo);

noBtn.addEventListener("click", () => {
  noClicks++;

  if(noClicks == 1) noBtn.innerText = "Are you sure? 😢";
  else if(noClicks == 2) noBtn.innerText = "Really sure?? 🥺";
  else if(noClicks == 3) noBtn.innerText = "Last chance 😭";
  else noBtn.innerText = "Impossible 😈";

  yesBtn.style.transform = `scale(${1 + noClicks * 0.3})`;
  moveNo();
});

function moveNo(){
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);

  noBtn.style.position = "absolute";
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

/* 💖 FLOATING HEARTS */
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerText = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}, 600);

/* 🎉 YES BUTTON */
yesBtn.addEventListener("click", () => {

  music.play().catch(()=>{});

  const celebrationSound = document.getElementById("celebrationSound");
  celebrationSound.currentTime = 0;
  celebrationSound.play();

  document.getElementById("app").innerHTML = `
    <div id="celebration" style="height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#ffe4ec;overflow:hidden;">
      <h1 style="color:#ff4d88;font-size:3em;">YAYYY!! 🎉💖</h1>
    </div>
  `;

  for(let i=0;i<100;i++){
    let confetti = document.createElement("div");
    confetti.innerHTML = "💖";

    confetti.style.position = "absolute";
    confetti.style.left = Math.random()*100 + "vw";
    confetti.style.top = "-10px";
    confetti.style.fontSize = (Math.random()*20+10)+"px";
    confetti.style.animation = `fall ${Math.random()*3+2}s linear`;

    document.getElementById("celebration").appendChild(confetti);

    setTimeout(()=>confetti.remove(),5000);
  }

  const style = document.createElement("style");
  style.innerHTML = `
    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  `;
  document.head.appendChild(style);

  setTimeout(() => {
    document.getElementById("app").innerHTML = `
      <div style="height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#ffe4ec;">
        <h1 style="color:#ff4d88;">Our Plan 💌</h1>
        <p>📍 Place: Kids Land</p>
        <p>⏰ Time: 5:00 PM</p>
        <p>Games, rides & snacks</p>
        <h2 style="margin-top:20px;">Can't wait 😍</h2>
      </div>
    `;
  }, 3000);
});

</script>

</body>
</html>
